version: '3.8'
services:
  web:
    build: .
    image: website-backend:latest
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - SESSION_SECRET=${SESSION_SECRET}
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      # persist sqlite file on host
      - ./db.sqlite:/app/db.sqlite
    depends_on:
      - redis

  redis:
    image: redis:7
    restart: unless-stopped

volumes:
  dbdata: {}
