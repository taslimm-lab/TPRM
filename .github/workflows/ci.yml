name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run test
      - name: Start server and run smoke tests
        run: |
          nohup npm start > server.log 2>&1 &
          for i in {1..15}; do
            status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/metrics || echo 000)
            echo "check $i -> $status"
            if [ "$status" = "200" ]; then break; fi
            sleep 1
          done
          npm run test:smoke-admin
